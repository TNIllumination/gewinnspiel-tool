# Lokale Entwicklung:  docker compose up -d db   (nur die Datenbank)
# Vollbetrieb:         docker compose up -d      (Datenbank + App)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gewinnspiel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gewinnspiel}
      POSTGRES_DB: ${POSTGRES_DB:-gewinnspiel}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gewinnspiel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gewinnspiel}:${POSTGRES_PASSWORD:-gewinnspiel}@db:5432/${POSTGRES_DB:-gewinnspiel}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    ports:
      - "3000:3000"

volumes:
  db-data:
